# Watches for the registrar to switch thehallucinator.ai to the four Route 53 name servers (infra/expected-nameservers.json).
# Every 15 minutes it asks public resolvers. When the answers match it dispatches the Infrastructure workflow on main once (the waiting
# certificate and placeholder stacks then deploy) and disables this workflow, so it never runs again. No issue, no AWS access.
# Scheduled workflows run on the default branch (develop); the dispatch targets main.
name: Delegation watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f12f86986dc69eaf5ad91d0608e21d8c25dc3df7 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@f12f86986dc69eaf5ad91d0608e21d8c25dc3df7 # v7.0.1
        with:
          repository: AnthusAI/Papyrus
          ref: f12f86986dc69eaf5ad91d0608e21d8c25dc3df7
          path: .papyrus-tool
          persist-credentials: false
      - name: Ask the public resolvers
        id: dns
        run: python3 .papyrus-tool/infra/pipeline/stack_deploy.py delegation --config infra/stacks.json
      - name: Start the deploy once, then stop watching
        if: steps.dns.outputs.delegated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run infrastructure.yml --ref main
          gh workflow disable delegation-watch.yml
          echo "Delegation seen: Infrastructure dispatched on main; this watcher is now disabled." >> "$GITHUB_STEP_SUMMARY"
