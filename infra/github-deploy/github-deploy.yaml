AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Humorus GitHub sign-in (OIDC provider) and the merge-to-main deploy role.
  The role can start and read Amplify jobs on the production branch and do
  nothing else. This template is prepared in Git and applied by a person; no
  workflow deploys it. See infra/github-deploy/README.md.

Parameters:
  GithubRepository:
    Type: String
    Default: AnthusAI/Humorus
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/repo allowed to assume the role.
  ProductionBranch:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
    Description: The one branch whose pushes may assume the role. Also the Amplify branch the role may build.
  AmplifyAppId:
    Type: String
    Default: "*"
    AllowedPattern: "^(\\*|d[a-z0-9]{9,15})$"
    Description: >-
      The Amplify app the role may build. Leave "*" until the app exists (the
      role is still limited to apps in this account), then update the stack
      with the real app id so the role names exactly one app.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" when the account already has a provider for
      token.actions.githubusercontent.com (IAM allows one per account).

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: humorus-github-deploy
      Description: !Sub "Merge-to-${ProductionBranch} deploy for ${GithubRepository}: GitHub OIDC on that branch only; amplify:StartJob and GetJob on that branch's jobs only"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GithubActionsOnTheProductionBranchOnly
            Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GithubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GithubRepository}:ref:refs/heads/${ProductionBranch}"
      Policies:
        - PolicyName: start-and-read-production-amplify-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartAndReadProductionJobs
                Effect: Allow
                Action:
                  - amplify:StartJob
                  - amplify:GetJob
                Resource: !Sub "arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${ProductionBranch}/jobs/*"

Outputs:
  GithubDeployRoleArn:
    Description: Role for the merge-to-main deploy workflow. Keep it in a GitHub variable, never in Git.
    Value: !GetAtt GithubDeployRole.Arn
