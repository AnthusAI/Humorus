name: CI

# Checks for every pull request and every push to the two long-lived branches.
# Branch protection requires one check, "ci", which passes only when every job
# it needs passed. Add a new check as a job and list it under `needs` of `ci`;
# nothing about branch protection changes.
#
# No AWS access: these workflows hold no credentials and assume no role.

on:
  pull_request:
    branches: [develop, main]
    # edited: re-check when the title changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret and AWS identifier scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install LeftBlock and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          python -m pip install --disable-pip-version-check leftblock==0.10.0
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz gitleaks
          gitleaks version
      - name: Scan the commits in this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/secret-scan.sh "$BASE_SHA" "$HEAD_SHA"

  board:
    name: Board and wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Kanbus
        run: python -m pip install --disable-pip-version-check kanbus==0.41.0
      - name: Validate the board
        run: kanbus validate
      - name: Lint the wiki
        run: kanbus wiki lint

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/ci/check-pr-title.sh "$PR_TITLE"

  # Add app tests here as one job (for example `tests`) and list it under
  # `needs` of `ci` below.

  ci:
    name: ci
    if: always()
    needs: [secret-scan, board, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check passed or was skipped on purpose
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a check did not pass: $r" >&2; exit 1 ;; esac
          done
